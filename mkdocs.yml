site_name: Legal Citation Hallucination Detector
site_description: Solução offline para o desafio Jusbrasil na BRACIS 2026.
repo_url: https://github.com/augustoafleal/legal-citation-hallucination-detector
repo_name: augustoafleal/legal-citation-hallucination-detector

theme:
  name: material
  language: pt-BR
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Usar tema claro

nav:
  - O desafio: index.md
  - Competição: competition.md
  - Arquitetura: architecture.md
  - Notebooks: notebooks.md
  - Scripts: scripts.md

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
